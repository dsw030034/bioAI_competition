[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "navgen"
version = "0.1.0"
description = "Scaffold-conditioned molecular generation and filtering for Nav1.8 / Nav1.5 selection studies"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "rdkit",
    "scikit-learn",
    "joblib",
]

[project.scripts]
navgen = "navgen.cli:main"
navgen-docking = "navgen.cli_docking:main"

[tool.setuptools.packages.find]
include = ["navgen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
