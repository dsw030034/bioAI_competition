[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nav18-generation"
version = "0.1.0"
description = "Reference-guided molecular generation and scoring for Nav1.8 site C"
requires-python = ">=3.10"
dependencies = ["rdkit>=2024.3", "numpy>=1.24", "scikit-learn>=1.3", "tomli>=2; python_version<'3.11'"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
navgen = "navgen.cli:main"

[tool.setuptools.packages.find]
include = ["navgen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

